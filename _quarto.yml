  site-url: https://inseefrlab.github.io/cartiflette-website/
  favicon: images/logo.png
  page-navigation: true
  navbar:
    logo: images/logo.png
    title: "cartiflette"
    left:
      - href: index.qmd
        text: Accueil
      - href: about.qmd
