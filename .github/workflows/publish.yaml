name: Publish website

on: 
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Python from .python-version, dependencies from uv.lock
      - name: Install the dependencies
        run: |
          uv sync --locked
          echo "QUARTO_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # _brand.yml (identité visuelle) demande Quarto 1.6 ou plus
          version: 1.10.18

      - name: Render FR version
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: complete
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          render: false
          target: gh-pages

      - name: Rebuild the site published by cartiflette
        env:
          GH_TOKEN: ${{ secrets.CARTIFLETTE_DISPATCH_TOKEN }}
        run: gh api repos/InseeFrLab/cartiflette/dispatches -f event_type=cartiflette-website
